<style>
/* 행사장 큰 화면용 상영 모드(site/show/). 1920×1080 무대를 화면 크기에 맞춰 통째로 늘이고 줄인다.

body{font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1B1F24;word-break:keep-all;-webkit-font-smoothing:antialiased}

.car{position:absolute;left:-19px;top:-19px;width:798px;height:794px}
.pane{position:absolute;left:8.2%;top:14.8%;width:84%;height:57.8%;overflow:hidden;background:#BFD0DF}

.cabin-img{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2}

.note.on{opacity:1}

.note .when{position:absolute;left:60px;bottom:56px;font-size:22px;color:#9AA1AB;font-family:'IBM Plex Mono',monospace}
.write{position:absolute;left:920px;top:876px;width:920px;height:150px}

<div class="ctl" id="ctl"><button id="bgm">음악 켜기</button><button id="fs">전체 화면</button></div>
<script>
(function(){
  // 무대 맞추기
  var stage=document.getElementById('stage');
  function fit(){var k=Math.min(window.innerWidth/1920,window.innerHeight/1080);stage.style.webkitTransform=stage.style.transform='scale('+k+')'}
  window.addEventListener('resize',fit);fit();

  // 기차 창: 사진 띠가 흐르고, 객실째 살짝 흔들림
  var st=document.getElementById('strip'),pane=document.getElementById('pane'),car=document.getElementById('car'),wno=document.getElementById('wno'),wtx=document.getElementById('wtx');
  var fs=[].slice.call(st.querySelectorAll('figure')),N=fs.length,caps=fs.map(function(f){return f.querySelector('figcaption').textContent});
  fs.forEach(function(f){st.appendChild(f.cloneNode(true))});
  var x=0,loop=1,mid=[],last=0,cur=-1,nextJ=1500,jt=-1e9,jA=0,SPEED=34;
  function measure(){mid=fs.map(function(f){return f.offsetLeft+f.offsetWidth/2});loop=(st.children[N].offsetLeft-fs[0].offsetLeft)||1}
  function mod(a,m){return((a%m)+m)%m}
  function frame(t){var dt=Math.min(.05,(t-(last||t))/1000);last=t;x=mod(x+SPEED*dt,loop);
    if(t>nextJ){jt=t;jA=1.6+Math.random()*1.4;nextJ=t+1400+Math.random()*1200}
    var e=(t-jt)/1000,jolt=e<.6?jA*Math.exp(-e*9)*Math.sin(e*42):0,cx=Math.sin(t/1700)*1.2,cy=Math.sin(t/640)*.9+jolt,cr=Math.sin(t/2300)*.12;
    car.style.webkitTransform=car.style.transform='translate('+cx+'px,'+cy+'px) rotate('+cr+'deg)';
    st.style.webkitTransform=st.style.transform='translate('+(-x-cx*.6)+'px,'+(-cy*.8)+'px)';
    var c=x+pane.offsetWidth/2,k=0,dd=1e9;for(var i=0;i<N;i++){var d=Math.abs(mod(c-mid[i]+loop/2,loop)-loop/2);if(d<dd){dd=d;k=i}}
    if(k!==cur){cur=k;wno.textContent=(k<9?'0':'')+(k+1);wtx.textContent=caps[k]}
    requestAnimationFrame(frame)}
  measure();[].forEach.call(st.querySelectorAll('img'),function(i){i.addEventListener('load',measure)});requestAnimationFrame(frame);

  // 메모: 한 장씩, 길이에 맞춰 머무는 시간·글자 크기. 1분마다 새 메모 확인(새 메모는 바로 다음에)
  var API='https://firestore.googleapis.com/v1/projects/park-retirement-2610/databases/(default)/documents/notes?key=AIzaSyBZsj0Z2nIA7YWi4Ty0Fkn-zELn-eUxX04',note=document.getElementById('note'),neb=document.getElementById('neb'),nmsg=document.getElementById('nmsg'),nwho=document.getElementById('nwho'),nwhen=document.getElementById('nwhen');
  var rows=[],seen={},queue=[],idx=-1,timer=null;
  function load(){if(!API||API.indexOf('http')!==0)return;var xh=new XMLHttpRequest();xh.open('GET',API+'&pageSize=300&orderBy=t');
    xh.onload=function(){try{var d=JSON.parse(xh.responseText),docs=(d&&d.documents)||[],first=!rows.length;
      docs.forEach(function(o){if(seen[o.name])return;seen[o.name]=1;var r={name:o.fields.name.stringValue,msg:o.fields.msg.stringValue,t:o.fields.t.timestampValue};rows.push(r);if(!first)queue.push(rows.length-1)});
      if(first&&rows.length&&idx<0)next()}catch(e){}};xh.send()}
  function size(n){return n<60?56:n<140?48:n<260?40:n<420?34:29}
  function show(i){var r=rows[i];note.className='note';setTimeout(function(){
      nmsg.style.fontSize=size(r.msg.length)+'px';nmsg.textContent=r.msg;nwho.textContent=r.name;
      var t=new Date(r.t);nwhen.textContent=isNaN(t)?'':(t.getMonth()+1)+'.'+t.getDate();
      neb.textContent='가족이 남긴 메모 · '+(i+1)+' / '+rows.length;
      for(var s=size(r.msg.length);nmsg.scrollHeight>nmsg.clientHeight+2&&s>22;s-=2)nmsg.style.fontSize=s+'px';   // 넘치면 조금씩 줄임
      note.className='note on'},900);
    clearTimeout(timer);timer=setTimeout(next,Math.max(9000,Math.min(24000,7000+r.msg.length*70))+900)}
  function next(){if(!rows.length){empty();timer=setTimeout(next,10000);return}idx=queue.length?queue.shift():(idx+1)%rows.length;show(idx)}
  function prev(){if(!rows.length)return;idx=(idx-1+rows.length)%rows.length;show(idx)}
  function empty(){nmsg.style.fontSize='44px';nmsg.textContent='아직 도착한 메모가 없어요.\n아래 QR로 첫 메모를 남겨 주세요';nwho.textContent='';nwhen.textContent='';note.className='note on'}
  load();setInterval(load,60000);setTimeout(function(){if(!rows.length&&idx<0)next()},4000);

  // 조작: 음악·전체 화면, 리모컨 ←→ 메모 넘기기, 확인 = 음악
  var ctl=document.getElementById('ctl'),bt=document.getElementById('bgm'),fb=document.getElementById('fs'),au=null,idleT=null;
  function wake(){ctl.className='ctl on';document.body.className='';clearTimeout(idleT);idleT=setTimeout(function(){ctl.className='ctl';document.body.className='idle'},4000)}
  function music(){if(!au){au=new Audio('../bgm.mp3');au.loop=true;au.volume=.5}if(au.paused){au.play();bt.textContent='음악 끄기'}else{au.pause();bt.textContent='음악 켜기'}}
  bt.onclick=music;
  fb.onclick=function(){var d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;if(f)f.call(d)};
  document.addEventListener('mousemove',wake);document.addEventListener('keydown',function(e){wake();var k=e.key||e.keyCode;
    if(k==='ArrowRight'||k===39)next();else if(k==='ArrowLeft'||k===37)prev();else if(k==='Enter'||k===13)music()});
  wake();
})();
